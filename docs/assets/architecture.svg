<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc"><title id="title">Cloud Security and Operations Platform architecture</title><desc id="desc">Three cloud foundations feed scoped inventory and event inputs, assessed by Python engines. Reports and operations evidence connect to a separate validation pipeline. Live deployment is a separate acceptance stage.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1440" height="1030" fill="#f1f5f9"/><rect width="1440" height="138" fill="#11243c"/><text x="44" y="43" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#72d8db">JAMIE CHRISTIAN II  /  ENGINEERING PORTFOLIO</text><text x="44" y="86" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="white">Cloud Security &amp; Operations Platform</text><text x="44" y="117" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">Versioned foundations • scoped evidence • repeatable controls • reviewable delivery</text><text x="44" y="174" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172b45">01  CLOUD FOUNDATIONS</text><rect x="44" y="193" width="432" height="148" rx="12" fill="white" stroke="#cbd5e1"/><rect x="44" y="193" width="7" height="148" rx="3" fill="#087e8b"/><text x="66" y="227" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b45">AWS</text><text x="66" y="258" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Private VPC + audit-reader role</text><text x="66" y="284" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">CloudTrail, flow logs, KMS + S3</text><text x="66" y="310" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Protected audit storage</text><rect x="504" y="193" width="432" height="148" rx="12" fill="white" stroke="#cbd5e1"/><rect x="504" y="193" width="7" height="148" rx="3" fill="#2563eb"/><text x="526" y="227" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b45">Microsoft Azure</text><text x="526" y="258" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Private subnet + scoped Reader</text><text x="526" y="284" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">NSG + Log Analytics workspace</text><text x="526" y="310" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Subscription activity diagnostics</text><rect x="964" y="193" width="432" height="148" rx="12" fill="white" stroke="#cbd5e1"/><rect x="964" y="193" width="7" height="148" rx="3" fill="#6d5bd0"/><text x="986" y="227" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b45">Google Cloud</text><text x="986" y="258" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Private VPC + bucket reader</text><text x="986" y="284" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Flow logs + audit configuration</text><text x="986" y="310" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Filtered sink + retained archive</text><text x="44" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172b45">02  INPUT AND TRUST BOUNDARY</text><rect x="44" y="390" width="650" height="125" rx="12" fill="white" stroke="#cbd5e1"/><rect x="44" y="390" width="7" height="125" rx="3" fill="#087e8b"/><text x="66" y="424" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b45">Inventory + collection scope</text><text x="66" y="455" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Strict normalized inventory; optional AWS SG collector</text><text x="66" y="481" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Azure/GCP inventory supplied manually; scope stays explicit</text><rect x="720" y="390" width="676" height="125" rx="12" fill="white" stroke="#cbd5e1"/><rect x="720" y="390" width="7" height="125" rx="3" fill="#2563eb"/><text x="742" y="424" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b45">Events + provenance</text><text x="742" y="455" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Synthetic identity/API JSONL; UTC timestamps + event IDs</text><text x="742" y="481" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Live SIEM integration requires separate schema/replay validation</text><path d="M420,341 L420,389" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1150,341 L1150,389" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M715,341 L715,366" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="735" y="367" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b">Live delivery acceptance required</text><path d="M370,516 L370,540 L260,540 L260,565" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1058,516 L1058,550 L720,550 L720,565" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="44" y="566" width="432" height="169" rx="12" fill="white" stroke="#cbd5e1"/><rect x="44" y="566" width="7" height="169" rx="3" fill="#087e8b"/><text x="66" y="600" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b45">CloudGuardian engine</text><text x="66" y="631" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">8 controls + stable finding IDs</text><text x="66" y="657" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">IPv4/IPv6 + ranges + wildcards</text><text x="66" y="683" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Expiry-aware accepted risks</text><text x="66" y="709" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Input failures stay visible</text><rect x="504" y="566" width="432" height="169" rx="12" fill="white" stroke="#cbd5e1"/><rect x="504" y="566" width="7" height="169" rx="3" fill="#2563eb"/><text x="526" y="600" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b45">Detection engine</text><text x="526" y="631" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Travel distance + elapsed time</text><text x="526" y="657" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Password spray + later success</text><text x="526" y="683" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Discovery API correlation</text><text x="526" y="709" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Sorted, deduplicated events</text><rect x="964" y="566" width="432" height="169" rx="12" fill="white" stroke="#cbd5e1"/><rect x="964" y="566" width="7" height="169" rx="3" fill="#6d5bd0"/><text x="986" y="600" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b45">Operations evidence</text><text x="986" y="631" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">JSON / CSV / HTML reports</text><text x="986" y="657" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">40 synthetic support tickets</text><text x="986" y="683" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">8 detailed case-study packets</text><text x="986" y="709" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">IR timeline + decision record</text><path d="M260,735 L260,755 L1180,755 L1180,736" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M936,650 L963,650" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="44" y="783" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172b45">03  DELIVERY VALIDATION — SEPARATE FROM CLOUD DEPLOYMENT</text><rect x="44" y="801" width="1352" height="138" rx="12" fill="white" stroke="#cbd5e1"/><rect x="44" y="801" width="7" height="138" rx="3" fill="#d97706"/><text x="66" y="835" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b45">GitHub Actions + local validation</text><text x="66" y="866" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Python tests  →  Terraform formatting / provider tests  →  Checkov / TFLint / Gitleaks</text><text x="66" y="892" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Focused plan policy reports coverage; artifacts retain command results and exceptions</text><text x="66" y="918" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Deployment remains an owner-approved step with real account, permission and telemetry acceptance.</text><text x="44" y="979" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#475569">Evidence boundary: offline tests and synthetic exercises do not establish live production readiness.</text></svg>