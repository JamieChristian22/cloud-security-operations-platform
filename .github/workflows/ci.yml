name: Cloud security validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline control suite and Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install offline dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests 04-cloudguardian-security-auditor
      - name: Run security policy and regression validation
        run: python scripts/automation/run_all.py
      - name: Upload offline test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-validation-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            scripts/reports/automation_summary.json
            scripts/reports/portfolio_validation.json
            evidence/validation/python-junit.xml

  terraform:
    name: Terraform format, validate and mocked tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - name: Validate all four Terraform roots without applying resources
        run: python3 scripts/iac/validate_terraform.py --output evidence/validation/terraform-ci
      - name: Upload Terraform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-validation-evidence
          retention-days: 14
          if-no-files-found: warn
          path: evidence/validation/terraform-ci/

  security:
    name: Secrets and infrastructure security scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full git history for secret scanning
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install isolated scanner dependencies
        run: python -m pip install -r requirements-security.txt
      - name: Install SHA256-verified scanner binaries
        run: python scripts/automation/install_ci_tools.py
      - name: Detect leaked secrets in git history
        run: gitleaks git . --redact --no-banner
      - name: Check Terraform configuration security
        run: checkov -d 01-multi-cloud-foundation-iam/terraform --framework terraform --compact
      - name: Check Terraform configuration quality
        run: |
          tflint --chdir=01-multi-cloud-foundation-iam/terraform --init
          tflint --chdir=01-multi-cloud-foundation-iam/terraform --format=compact
